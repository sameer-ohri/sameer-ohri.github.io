<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 Red Sox Tickets</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 40px;
      background-color: #ffffff;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
    }

    .info-box {
      background: #f5f5f5;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 18px;
      border: 1px solid #e2e2e2;
    }

    .info-box p {
      margin: 6px 0;
      line-height: 1.5;
    }

    .open-sheet {
      margin: 0 0 20px;
    }

    .open-sheet a {
      display: inline-block;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #ddd;
      text-decoration: none;
      color: #111;
      background: #fff;
      font-weight: 700;
    }

    .iframe-wrapper {
      overflow: hidden;
      border: 1px solid #ddd;
      border-radius: 14px;
      height: 960px;
    }

    iframe {
      width: 100%;
      height: 1060px;
      border: none;
      margin-top: -60px;
      display: block;
    }

    @media (max-width: 700px) {
      body {
        margin: 16px;
      }
      
      .open-sheet a {
        width: 100%;
        text-align: center;
        box-sizing: border-box;
        margin-bottom: 10px;
      }

      .container {
        max-width: 100%;
      }

      .iframe-wrapper {
        display: none;
      }

      .mobile-note {
        display: block;
        font-size: 15px;
        margin-bottom: 12px;
      }
    }

    .mobile-note {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">

    <div style="height:4px; background:#BD3039; border-radius:2px; margin-bottom:18px;"></div>

    <h1>2026 Red Sox Tickets</h1>

    <div class="info-box">
      <p><strong>Tickets available for sale</strong></p>
      <p>Price listed is for each seat</p>
      <p>Box 94, Row BB, Seats 15 & 16</p>
      <p>Last updated: February 28, 2026</p>
    </div>

    <div class="mobile-note">
      For the best experience on mobile, open the sheet directly:
    </div>

    <div class="open-sheet">
      <a
        href="https://docs.google.com/spreadsheets/d/e/2PACX-1vT52G37krYJ9CGdOPl0sd4hb2fca0ua0ITD2wBG4XemqD78rIseibSqd6_wardFKKDKlE5gpIHFtok6/pubhtml?gid=543586345&single=true"
        target="_blank"
        rel="noopener"
      >
        Open the ticket sheet
      </a>

      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLScZy44yn3VJND8hccbhosfDWDpLTeC9pa8NCs4V0Y_cGKccFw/viewform?usp=publish-editor"
        target="_blank"
        rel="noopener"
        style="background:#BD3039; color:white; margin-left:12px;"
      >
        Request Tickets
      </a>

      <a
        href="https://venmo.com/sameer-ohri"
        target="_blank"
        rel="noopener"
        style="margin-left:12px; color:#3D95CE;"
        title="Venmo"
      >
        <i class="fa-brands fa-venmo" style="font-size:24px;"></i>
      </a>

      <a
        href="https://paypal.me/SameerOhri1533"
        target="_blank"
        rel="noopener"
        style="margin-left:12px; color:#003087;"
        title="PayPal"
      >
        <i class="fa-brands fa-paypal" style="font-size:24px;"></i>
      </a>
    </div>

    <div class="iframe-wrapper">
      <iframe
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT52G37krYJ9CGdOPl0sd4hb2fca0ua0ITD2wBG4XemqD78rIseibSqd6_wardFKKDKlE5gpIHFtok6/pubhtml?gid=543586345&single=true">
      </iframe>
    </div>

  </div>
</body>
</html>
