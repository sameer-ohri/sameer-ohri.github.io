<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 Red Sox Tickets</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 40px;
      background-color: #ffffff;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
    }

    .info-box {
      background: #f5f5f5;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 25px;
      border: 1px solid #e2e2e2;
    }

    .info-box p {
      margin: 6px 0;
      line-height: 1.5;
    }

    <div style="margin: 0 0 14px;">
  <a

    target="_blank"
    rel="noopener"
    style="
      display:inline-block;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #ddd;
      text-decoration: none;
      color: #111;
      background: #fff;
      font-weight: 700;
    "
  >
    Open the ticket sheet in a new tab
  </a>
</div>
    
    iframe {
      width: 100%;
      height: 1000px;
      border: 1px solid #ddd;
      border-radius: 14px;
    }

    @media (max-width: 700px) {
      body {
        margin: 16px;
      }

      .container {
        max-width: 100%;
      }

      iframe {
        height: 1200px;
      }

      .info-box {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Red Sox accent bar -->
    <div style="height:4px; background:#BD3039; border-radius:2px; margin-bottom:18px;"></div>

    <h1>2026 Red Sox Tickets</h1>

      <p>This page is for friends.</p>
      <p>Text me the game(s) you want and how many tickets.</p>
      <p>First to confirm gets them until paid.</p>
      <p>Payment: Venmo / Zelle.</p>
    </div>

    <iframe 
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT52G37krYJ9CGdOPl0sd4hb2fca0ua0ITD2wBG4XemqD78rIseibSqd6_wardFKKDKlE5gpIHFtok6/pubhtml?gid=0&single=true">
