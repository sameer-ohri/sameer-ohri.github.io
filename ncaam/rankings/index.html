<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>NCAAM Rankings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #f7f8fa;
      color: #111;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    .accent-bar {
      height: 5px;
      background: #002868;
      border-radius: 3px;
      margin-bottom: 20px;
    }

    h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.3px; }

    .subtitle { font-size: 13px; color: #666; margin: 0 0 16px; }

    .stale {
      font-size: 13px;
      color: #8a5a00;
      background: #fff4d6;
      border: 1px solid #f0dca0;
      border-radius: 8px;
      padding: 8px 12px;
      margin: 0 0 16px;
    }

    .search {
      font: inherit;
      font-size: 15px;
      width: 100%;
      max-width: 320px;
      padding: 8px 12px;
      border: 1px solid #cfd5de;
      border-radius: 8px;
      margin-bottom: 14px;
      background: #fff;
    }

    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border: 1px solid #e3e6eb;
      border-radius: 10px;
    }

    table { border-collapse: collapse; width: 100%; font-size: 13px; }

    th, td {
      padding: 7px 10px;
      text-align: center;
      white-space: nowrap;
      border-bottom: 1px solid #eef0f3;
    }

    th {
      background: #f2f4f7;
      font-weight: 600;
      color: #444;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
    }

    th.active::after { content: " \25B2"; font-size: 10px; }
    th.active.desc::after { content: " \25BC"; }

    td.team, th.team { text-align: left; position: sticky; left: 0; background: #fff; }
    th.team { background: #f2f4f7; }
    td.rk { color: #666; }
    tr:hover td { background: #f7fafd; }
    tr:hover td.team { background: #f7fafd; }

    .empty-line { color: #666; padding: 16px; margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="accent-bar"></div>
    <h1>NCAAM Rankings</h1>
    <p class="subtitle" id="subtitle"></p>
    <div id="stale"></div>

    <input class="search" id="search" type="search" placeholder="Find a team" aria-label="Find a team" />

    <div class="table-wrap">
      <table>
        <thead id="head"></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <p class="empty-line" id="empty" hidden>No teams match that search.</p>
  </div>

  <script>
    const DATA_URL = "data/rankings_latest.json";

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    function longDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-US",
        { weekday: "long", month: "long", day: "numeric" });
    }

    // Columns: Rk, Team. Click a header to sort; default is Rk.
    const STATE = { key: "rk", desc: false, query: "" };
    let DATA = null;

    function value(t, key) {
      return t[key];
    }

    function sortedTeams() {
      const k = STATE.key, dir = STATE.desc ? -1 : 1;
      return DATA.teams.slice().sort((a, b) => {
        const x = value(a, k), y = value(b, k);
        // Missing values always sort last, whichever way the column runs.
        if (x == null) return 1;
        if (y == null) return -1;
        if (typeof x === "string") return dir * x.localeCompare(y) || a.rk - b.rk;
        return dir * (x - y) || a.rk - b.rk;
      });
    }

    function renderHead() {
      const cols = [["rk", "Rk"], ["team", "Team"]];
      document.getElementById("head").innerHTML = "<tr>" + cols.map(([key, label]) => {
        const cls = [key === "team" ? "team" : "", STATE.key === key ? "active" : "", STATE.key === key && STATE.desc ? "desc" : ""]
          .filter(Boolean).join(" ");
        return `<th class="${cls}" data-key="${esc(key)}">${esc(label)}</th>`;
      }).join("") + "</tr>";
    }

    function renderBody() {
      const q = STATE.query.trim().toLowerCase();
      const teams = sortedTeams().filter(t => !q || t.team.toLowerCase().includes(q));
      const body = document.getElementById("body");
      body.innerHTML = teams.map(t => `<tr>
          <td class="rk">${t.rk}</td>
          <td class="team">${esc(t.team)}</td>
        </tr>`).join("");
      document.getElementById("empty").hidden = teams.length > 0;
    }

    function render() {
      renderHead();
      renderBody();
    }

    document.getElementById("head").addEventListener("click", e => {
      const th = e.target.closest("th");
      if (!th) return;
      const key = th.dataset.key;
      // Text and rank columns start A→Z / best first; numbers start best first too.
      if (STATE.key === key) STATE.desc = !STATE.desc;
      else { STATE.key = key; STATE.desc = false; }
      render();
    });

    document.getElementById("search").addEventListener("input", e => {
      STATE.query = e.target.value;
      renderBody();
    });

    fetch(DATA_URL, { cache: "no-cache" })
      .then(r => r.json())
      .then(d => {
        DATA = d;
        const sub = document.getElementById("subtitle");
        sub.textContent = longDate(d.date);
        if (d.source_date && d.source_date !== d.date) {
          document.getElementById("stale").innerHTML =
            `<p class="stale">These rankings are from ${esc(longDate(d.source_date))}. Today's are not in yet.</p>`;
        }
        if (!d.teams.length) {
          sub.textContent = "No rankings published yet.";
          document.getElementById("empty").textContent = "No rankings published yet.";
          document.getElementById("empty").hidden = false;
          return;
        }
        render();
      })
      .catch(() => {
        document.getElementById("subtitle").textContent = "Could not load the rankings.";
      });
  </script>
</body>
</html>
