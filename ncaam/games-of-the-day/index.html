<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>NCAAM Games of the Day</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #f7f8fa;
      color: #111;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    .accent-bar {
      height: 5px;
      background: #002868;
      border-radius: 3px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 4px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin: 0 0 20px;
    }

    .stale {
      font-size: 13px;
      color: #8a5a00;
      background: #fff4d6;
      border: 1px solid #f0dca0;
      border-radius: 8px;
      padding: 8px 12px;
      margin: -8px 0 20px;
    }

    /* Big games / All games switch */
    .toggle {
      display: inline-flex;
      background: #e9ecf0;
      border-radius: 9px;
      padding: 3px;
      margin-bottom: 10px;
    }

    .toggle button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      border: 0;
      background: transparent;
      color: #555;
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .toggle button.on {
      background: #fff;
      color: #002868;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .note {
      font-size: 12px;
      color: #888;
      margin: 0 0 14px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e2e6ea;
      overflow: hidden;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      padding: 10px 8px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #888;
      border-bottom: 1px solid #e8eaed;
    }

    tbody td {
      padding: 9px 8px;
      text-align: left;
      border-bottom: 1px solid #f0f2f5;
      vertical-align: top;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    th.num, td.num {
      text-align: center;
    }

    td.time {
      white-space: nowrap;
      color: #444;
    }

    td.small {
      font-size: 11px;
      color: #888;
    }

    .qual {
      font-weight: 600;
      border-radius: 6px;
    }

    /* In the All games view, big games (and UConn) are bold */
    .all tr.big td.team, .all tr.big td.pred, .all .game.big .teams {
      font-weight: 700;
    }

    /* Phone cards (shown instead of the table below 600px) */
    .cards { display: none; }

    .game {
      padding: 11px 14px;
      border-bottom: 1px solid #f0f2f5;
    }

    .game:last-child { border-bottom: none; }

    .game .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #888;
      margin-bottom: 3px;
    }

    .game .top .qual {
      font-size: 13px;
      color: #111;
      padding: 2px 8px;
      min-width: 44px;
      text-align: center;
    }

    .game .teams {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .all .game .teams { font-weight: 400; }

    .game .at {
      color: #999;
      font-weight: 400;
    }

    .game .pred {
      font-size: 13px;
      color: #555;
      margin-top: 2px;
    }

    #empty, #error {
      font-size: 14px;
      margin: 40px 0;
      text-align: center;
      color: #666;
    }

    #error { color: #c0392b; }

    @media (max-width: 599px) {
      .table-view { display: none; }
      .cards { display: block; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="accent-bar"></div>
    <h1>NCAAM Games of the Day</h1>
    <p class="subtitle" id="subtitle">Loading…</p>
    <div class="stale" id="stale" style="display:none"></div>

    <div id="main" style="display:none">
      <div class="toggle">
        <button id="btn-big" type="button">Big games</button>
        <button id="btn-all" type="button">All games</button>
      </div>
      <p class="note" id="note"></p>

      <div class="card" id="card">
        <div class="table-view">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>TV</th>
                <th>Visitor</th>
                <th>Home</th>
                <th>Venue</th>
                <th>Prediction</th>
                <th class="num">QualScore</th>
              </tr>
            </thead>
            <tbody id="games-body"></tbody>
          </table>
        </div>
        <div class="cards" id="cards"></div>
      </div>
    </div>

    <div id="empty" style="display:none"></div>
    <div id="error" style="display:none"></div>

  </div>

  <script>
    const DATA_URL = "data/games_latest.json";

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    function longDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-US",
        { weekday: "long", month: "long", day: "numeric" });
    }

    function todayIso() {
      const t = new Date();
      const p = n => String(n).padStart(2, "0");
      return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
    }

    // Same colors as the Excel attachment: red (low) → yellow (median) → green (high),
    // by each game's percentile among ALL of the day's games.
    const RED = [248, 105, 107], YELLOW = [255, 235, 132], GREEN = [99, 190, 123];
    function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
    let SORTED = [];
    function qualStyle(q) {
      if (q == null || SORTED.length < 2) return "";
      const p = SORTED.indexOf(q) / (SORTED.length - 1);
      const c = p < 0.5 ? mix(RED, YELLOW, p / 0.5) : mix(YELLOW, GREEN, (p - 0.5) / 0.5);
      return `background: rgb(${c.join(",")})`;
    }
    function qualText(q) { return q == null ? "" : q.toFixed(1); }

    function tableRow(g) {
      return `<tr class="${g.big ? "big" : ""}">
        <td class="time">${esc(g.time)}</td>
        <td class="small">${esc(g.tv)}</td>
        <td class="team">${esc(g.visitor)}</td>
        <td class="team">${esc(g.home)}</td>
        <td class="small">${esc(g.venue)}</td>
        <td class="pred">${esc(g.prediction)}</td>
        <td class="num qual" style="${qualStyle(g.qual)}">${qualText(g.qual)}</td>
      </tr>`;
    }

    function card(g) {
      const when = [g.time, g.tv].filter(Boolean).map(esc).join(" · ");
      return `<div class="game ${g.big ? "big" : ""}">
        <div class="top">
          <span>${when}</span>
          <span class="qual" style="${qualStyle(g.qual)}">${qualText(g.qual)}</span>
        </div>
        <div class="teams">${esc(g.visitor)} <span class="at">@</span> ${esc(g.home)}</div>
        <div class="pred">${esc(g.short || g.prediction)}</div>
      </div>`;
    }

    let DATA = null;

    function show(mode) {
      const games = DATA.games;
      const big = games.filter(g => g.big)
        // Same order as the email: UConn first, then best game first
        .sort((a, b) => (b.uconn - a.uconn) || ((b.qual ?? -1) - (a.qual ?? -1)));
      const list = mode === "big" ? big : games;

      document.getElementById("btn-big").textContent = `Big games (${big.length})`;
      document.getElementById("btn-all").textContent = `All games (${games.length})`;
      document.getElementById("btn-big").classList.toggle("on", mode === "big");
      document.getElementById("btn-all").classList.toggle("on", mode === "all");
      document.getElementById("card").className = `card ${mode}`;

      document.getElementById("note").textContent = mode === "big"
        ? "QualScore above 65, plus any UConn game. Best game first."
        : "In tip-off order. Bold = big game or UConn.";

      document.getElementById("games-body").innerHTML = list.map(tableRow).join("");
      document.getElementById("cards").innerHTML = list.map(card).join("");
    }

    fetch(DATA_URL, { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        DATA = data;
        const n = data.games.length;
        document.getElementById("subtitle").textContent =
          `${longDate(data.date)} · ${n} game${n === 1 ? "" : "s"}` +
          " · Numbers are the KenPom + Torvik average";

        if (data.date !== todayIso()) {
          const el = document.getElementById("stale");
          el.style.display = "block";
          el.textContent = `This is the table for ${longDate(data.date)}. ` +
            "Today's hasn't been published yet (it updates around 7:00 AM ET).";
        }

        if (n === 0) {
          const el = document.getElementById("empty");
          el.style.display = "block";
          el.textContent = "No games table for this day.";
          return;
        }

        SORTED = data.games.map(g => g.qual).filter(q => q != null).sort((a, b) => a - b);
        document.getElementById("btn-big").onclick = () => show("big");
        document.getElementById("btn-all").onclick = () => show("all");
        // Start on big games; a day with none starts on all games instead.
        show(data.games.some(g => g.big) ? "big" : "all");
        document.getElementById("main").style.display = "block";
      })
      .catch(err => {
        document.getElementById("subtitle").textContent = "";
        const el = document.getElementById("error");
        el.style.display = "block";
        el.textContent = `Failed to load games: ${err.message}`;
      });
  </script>
</body>
</html>
