<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>NCAAM Games of the Day</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #f7f8fa;
      color: #111;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    .accent-bar {
      height: 5px;
      background: #002868;
      border-radius: 3px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 4px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin: 0 0 24px;
    }

    .stale {
      font-size: 13px;
      color: #8a5a00;
      background: #fff4d6;
      border: 1px solid #f0dca0;
      border-radius: 8px;
      padding: 8px 12px;
      margin: -12px 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e2e6ea;
      overflow: hidden;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      padding: 10px 8px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #888;
      border-bottom: 1px solid #e8eaed;
    }

    tbody td {
      padding: 9px 8px;
      text-align: left;
      border-bottom: 1px solid #f0f2f5;
      vertical-align: top;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    th.num, td.num {
      text-align: center;
    }

    td.time {
      white-space: nowrap;
      color: #444;
    }

    td.small {
      font-size: 11px;
      color: #888;
    }

    td.qual {
      font-weight: 600;
      border-radius: 6px;
    }

    /* Big games (QualScore above the email's threshold) and UConn games */
    tr.big td.team, tr.big td.pred {
      font-weight: 700;
    }

    .note {
      font-size: 12px;
      color: #888;
      margin: -12px 0 24px;
    }

    #empty, #error {
      font-size: 14px;
      margin: 40px 0;
      text-align: center;
      color: #666;
    }

    #error { color: #c0392b; }

    .show-mobile { display: none; }
    .table-wrap { overflow-x: auto; }

    /* Phones: drop TV and Venue so the table fits */
    @media (max-width: 599px) {
      .hide-mobile { display: none; }
      .show-mobile { display: inline; }
      table { font-size: 12px; }
      tbody td, thead th { padding: 8px 3px; }
      td.time { white-space: normal; width: 52px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="accent-bar"></div>
    <h1>NCAAM Games of the Day</h1>
    <p class="subtitle" id="subtitle">Loading…</p>
    <div class="stale" id="stale" style="display:none"></div>

    <div class="card" id="card" style="display:none">
      <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th class="hide-mobile">TV</th>
            <th>Visitor</th>
            <th>Home</th>
            <th class="hide-mobile">Venue</th>
            <th>Prediction</th>
            <th class="num"><span class="hide-mobile">QualScore</span><span class="show-mobile">Qual</span></th>
          </tr>
        </thead>
        <tbody id="games-body"></tbody>
      </table>
      </div>
    </div>
    <p class="note" id="note" style="display:none">
      Team numbers are the average KenPom + Torvik rank. Prediction and QualScore
      (game quality, 0–100) average KenPom and Torvik. Bold = big game or UConn.
    </p>

    <div id="empty" style="display:none"></div>
    <div id="error" style="display:none"></div>

  </div>

  <script>
    const DATA_URL = "data/games_latest.json";

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    function longDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-US",
        { weekday: "long", month: "long", day: "numeric" });
    }

    function todayIso() {
      const t = new Date();
      const p = n => String(n).padStart(2, "0");
      return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
    }

    // Same colors as the Excel attachment: red (low) → yellow (median) → green (high),
    // by each game's percentile among today's games.
    const RED = [248, 105, 107], YELLOW = [255, 235, 132], GREEN = [99, 190, 123];
    function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
    function qualColor(q, sorted) {
      if (q == null || sorted.length < 2) return "";
      const p = sorted.indexOf(q) / (sorted.length - 1);
      const c = p < 0.5 ? mix(RED, YELLOW, p / 0.5) : mix(YELLOW, GREEN, (p - 0.5) / 0.5);
      return `background: rgb(${c.join(",")})`;
    }

    function row(g, sorted) {
      return `<tr class="${g.big ? "big" : ""}">
        <td class="time">${esc(g.time)}</td>
        <td class="small hide-mobile">${esc(g.tv)}</td>
        <td class="team">${esc(g.visitor)}</td>
        <td class="team">${esc(g.home)}</td>
        <td class="small hide-mobile">${esc(g.venue)}</td>
        <td class="pred">${esc(g.prediction)}</td>
        <td class="num qual" style="${qualColor(g.qual, sorted)}">${g.qual == null ? "" : g.qual.toFixed(1)}</td>
      </tr>`;
    }

    fetch(DATA_URL, { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        const n = data.games.length;
        document.getElementById("subtitle").textContent =
          `${longDate(data.date)} · ${n} game${n === 1 ? "" : "s"}`;

        if (data.date !== todayIso()) {
          const el = document.getElementById("stale");
          el.style.display = "block";
          el.textContent = `This is the table for ${longDate(data.date)}. ` +
            "Today's hasn't been published yet (it updates around 7:00 AM ET).";
        }

        if (n === 0) {
          const el = document.getElementById("empty");
          el.style.display = "block";
          el.textContent = "No games table for this day.";
          return;
        }

        const sorted = data.games.map(g => g.qual).filter(q => q != null).sort((a, b) => a - b);
        document.getElementById("games-body").innerHTML =
          data.games.map(g => row(g, sorted)).join("");
        document.getElementById("card").style.display = "block";
        document.getElementById("note").style.display = "block";
      })
      .catch(err => {
        document.getElementById("subtitle").textContent = "";
        const el = document.getElementById("error");
        el.style.display = "block";
        el.textContent = `Failed to load games: ${err.message}`;
      });
  </script>
</body>
</html>
