<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>NCAAM Games of the Day</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background: #f7f8fa;
      color: #111;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    .accent-bar {
      height: 5px;
      background: #002868;
      border-radius: 3px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 4px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin: 0 0 20px;
    }

    .stale {
      font-size: 13px;
      color: #8a5a00;
      background: #fff4d6;
      border: 1px solid #f0dca0;
      border-radius: 8px;
      padding: 8px 12px;
      margin: -8px 0 20px;
    }

    /* Switches: Big games / All games, and Best first / By time */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .toggle {
      display: inline-flex;
      background: #e9ecf0;
      border-radius: 9px;
      padding: 3px;
    }

    .toggle button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      border: 0;
      background: transparent;
      color: #555;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
    }

    .toggle button.on {
      background: #fff;
      color: #002868;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .note {
      font-size: 12px;
      color: #888;
      margin: 0 0 18px;
    }

    /* Sections: On now / Up next / Earlier today */
    h2 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #444;
      margin: 22px 0 10px;
    }

    h2 .count {
      color: #999;
      font-weight: 500;
    }

    h2.live::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d93025;
      margin-right: 7px;
      vertical-align: 1px;
    }

    h3 {
      font-size: 13px;
      font-weight: 600;
      color: #002868;
      margin: 14px 0 8px;
    }

    .empty-line {
      font-size: 13px;
      color: #777;
      margin: 0 0 6px;
    }

    details summary {
      cursor: pointer;
      list-style: none;
    }

    details summary::-webkit-details-marker { display: none; }

    details summary h2::after {
      content: " ▸";
      color: #999;
    }

    details[open] summary h2::after { content: " ▾"; }

    /* Game cards: one column on phones, two on wider screens */
    .list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @media (min-width: 700px) {
      .list { grid-template-columns: 1fr 1fr; }
    }

    .game {
      background: #fff;
      border: 1px solid #e2e6ea;
      border-radius: 12px;
      padding: 11px 14px;
    }

    .game .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .game .when {
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .tv {
      font-size: 11px;
      font-weight: 600;
      color: #002868;
      background: #e8edf6;
      border-radius: 5px;
      padding: 2px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .qual {
      font-size: 13px;
      font-weight: 600;
      color: #111;
      border-radius: 6px;
      padding: 2px 8px;
      min-width: 44px;
      text-align: center;
      flex: none;
    }

    .game .teams {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.3;
    }

    .game.big .teams { font-weight: 700; }

    .game .at {
      color: #999;
      font-weight: 400;
    }

    .game .pred {
      font-size: 13px;
      color: #555;
      margin-top: 2px;
    }

    .game .venue {
      font-size: 11px;
      color: #999;
      margin-top: 3px;
    }

    @media (max-width: 599px) {
      .game .venue { display: none; }
    }

    #empty, #error {
      font-size: 14px;
      margin: 40px 0;
      text-align: center;
      color: #666;
    }

    #error { color: #c0392b; }
  </style>
</head>
<body>
  <div class="container">

    <div class="accent-bar"></div>
    <h1>NCAAM Games of the Day</h1>
    <p class="subtitle" id="subtitle">Loading…</p>
    <div class="stale" id="stale" style="display:none"></div>

    <div id="main" style="display:none">
      <div class="controls">
        <div class="toggle">
          <button id="btn-big" type="button">Big games</button>
          <button id="btn-all" type="button">All games</button>
        </div>
        <div class="toggle">
          <button id="btn-best" type="button">Best first</button>
          <button id="btn-time" type="button">By time</button>
        </div>
      </div>
      <p class="note">Times are Eastern. Big = QualScore above 65, or UConn. A game counts as
        on for about 2 hours after tip-off.</p>
      <div id="sections"></div>
    </div>

    <div id="empty" style="display:none"></div>
    <div id="error" style="display:none"></div>

  </div>

  <script>
    const DATA_URL = "data/games_latest.json";
    const GAME_MINUTES = 120;  // how long a game counts as "on" after tip-off

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    function longDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-US",
        { weekday: "long", month: "long", day: "numeric" });
    }

    // Today's date and the minutes since midnight, in Eastern time.
    // ?now=15:00 pretends it's 3 p.m. on the table's own date (for previews).
    function easternNow(dataDate) {
      const forced = new URLSearchParams(location.search).get("now");
      if (forced && /^\d{1,2}:\d{2}$/.test(forced)) {
        const [h, m] = forced.split(":").map(Number);
        return { date: dataDate, min: h * 60 + m };
      }
      const parts = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23",
      }).formatToParts(new Date()).map(p => [p.type, p.value]));
      return { date: `${parts.year}-${parts.month}-${parts.day}`, min: +parts.hour * 60 + +parts.minute };
    }

    // "7:30 PM" -> minutes since midnight (null if there's no time, e.g. TBA)
    function tipMinutes(t) {
      const m = /^(\d{1,2}):(\d{2})\s*([AP]M)$/i.exec(String(t || "").trim());
      if (!m) return null;
      let h = +m[1] % 12;
      if (m[3].toUpperCase() === "PM") h += 12;
      return h * 60 + +m[2];
    }

    // Newspaper style: Noon, Midnight, 4 p.m., 7:30 p.m.
    function niceTime(min) {
      if (min == null) return "Time TBA";
      if (min === 12 * 60) return "Noon";
      if (min === 0) return "Midnight";
      const h = Math.floor(min / 60), m = min % 60;
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${h12}${m ? ":" + String(m).padStart(2, "0") : ""} ${h < 12 ? "a.m." : "p.m."}`;
    }

    // Same colors as the Excel attachment: red (low) → yellow (median) → green (high),
    // by each game's percentile among ALL of the day's games.
    const RED = [248, 105, 107], YELLOW = [255, 235, 132], GREEN = [99, 190, 123];
    function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
    let SORTED = [];
    function qualStyle(q) {
      if (q == null || SORTED.length < 2) return "";
      const p = SORTED.indexOf(q) / (SORTED.length - 1);
      const c = p < 0.5 ? mix(RED, YELLOW, p / 0.5) : mix(YELLOW, GREEN, (p - 0.5) / 0.5);
      return `background: rgb(${c.join(",")})`;
    }

    function card(g) {
      const tv = g.tv ? `<span class="tv">${esc(g.tv)}</span>` : "";
      return `<div class="game ${g.big ? "big" : ""}">
        <div class="top">
          <span class="when">${esc(niceTime(g.tip))} ${tv}</span>
          <span class="qual" style="${qualStyle(g.qual)}">${g.qual == null ? "" : g.qual.toFixed(1)}</span>
        </div>
        <div class="teams">${esc(g.visitor)} <span class="at">@</span> ${esc(g.home)}</div>
        <div class="pred">${esc(g.prediction)}</div>
        ${g.venue ? `<div class="venue">${esc(g.venue)}</div>` : ""}
      </div>`;
    }

    const byBest = (a, b) => (b.qual ?? -1) - (a.qual ?? -1);
    const byTime = (a, b) => ((a.tip ?? 9999) - (b.tip ?? 9999)) || byBest(a, b);

    function list(games) {
      return `<div class="list">${games.map(card).join("")}</div>`;
    }

    // By time: a header per start time ("7 p.m."), best game first under each.
    function grouped(games) {
      const groups = new Map();
      for (const g of games.slice().sort(byTime)) {
        const k = niceTime(g.tip);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(g);
      }
      return [...groups].map(([k, gs]) => `<h3>${esc(k)}</h3>${list(gs)}`).join("");
    }

    function section(title, games, sort, opts = {}) {
      const head = `<h2 class="${opts.live ? "live" : ""}">${title}
        <span class="count">${games.length}</span></h2>`;
      const body = sort === "time" && opts.groups ? grouped(games)
        : list(games.slice().sort(sort === "time" ? byTime : byBest));
      if (opts.collapsible) {
        return `<details ${opts.open ? "open" : ""}><summary>${head}</summary>${body}</details>`;
      }
      return head + body;
    }

    let DATA = null;
    const STATE = { filter: "big", sort: "best" };

    function render() {
      const now = easternNow(DATA.date);
      const games = DATA.games.filter(g => STATE.filter === "all" || g.big);

      const on = [], next = [], done = [];
      for (const g of games) {
        let status;
        if (now.date > DATA.date) status = "done";          // yesterday's table
        else if (now.date < DATA.date || g.tip == null) status = "next";
        else if (now.min >= g.tip + GAME_MINUTES) status = "done";
        else if (now.min >= g.tip) status = "on";
        else status = "next";
        ({ on, next, done })[status].push(g);
      }

      let html = "";
      if (on.length) {
        html += section("On now", on, STATE.sort, { live: true });
      } else if (next.length) {
        const first = Math.min(...next.map(g => g.tip ?? 9999));
        html += `<h2>On now</h2><p class="empty-line">Nothing on right now. Next tip-off:
          ${esc(niceTime(first === 9999 ? null : first))}.</p>`;
      }
      if (next.length) html += section("Up next", next, STATE.sort, { groups: true });
      if (done.length) {
        html += section("Earlier today", done, STATE.sort,
          { groups: true, collapsible: true, open: !on.length && !next.length });
      }
      if (!games.length) {
        html = `<p class="empty-line">No big games today. Tap All games to see the full slate.</p>`;
      }
      document.getElementById("sections").innerHTML = html;

      const nBig = DATA.games.filter(g => g.big).length;
      document.getElementById("btn-big").textContent = `Big games (${nBig})`;
      document.getElementById("btn-all").textContent = `All games (${DATA.games.length})`;
      document.getElementById("btn-big").classList.toggle("on", STATE.filter === "big");
      document.getElementById("btn-all").classList.toggle("on", STATE.filter === "all");
      document.getElementById("btn-best").classList.toggle("on", STATE.sort === "best");
      document.getElementById("btn-time").classList.toggle("on", STATE.sort === "time");
    }

    fetch(DATA_URL, { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        DATA = data;
        for (const g of data.games) g.tip = tipMinutes(g.time);
        const n = data.games.length;
        document.getElementById("subtitle").textContent =
          `${longDate(data.date)} · ${n} game${n === 1 ? "" : "s"}`;

        if (data.date !== easternNow(data.date).date) {
          const el = document.getElementById("stale");
          el.style.display = "block";
          el.textContent = `This is the table for ${longDate(data.date)}. ` +
            "Today's hasn't been published yet (it updates around 7:00 AM ET).";
        }

        if (n === 0) {
          const el = document.getElementById("empty");
          el.style.display = "block";
          el.textContent = "No games table for this day.";
          return;
        }

        SORTED = data.games.map(g => g.qual).filter(q => q != null).sort((a, b) => a - b);
        // Start on big games; a day with none starts on all games instead.
        if (!data.games.some(g => g.big)) STATE.filter = "all";
        document.getElementById("btn-big").onclick = () => { STATE.filter = "big"; render(); };
        document.getElementById("btn-all").onclick = () => { STATE.filter = "all"; render(); };
        document.getElementById("btn-best").onclick = () => { STATE.sort = "best"; render(); };
        document.getElementById("btn-time").onclick = () => { STATE.sort = "time"; render(); };
        render();
        document.getElementById("main").style.display = "block";
        // Move games along as the day goes on without a reload.
        setInterval(render, 60 * 1000);
      })
      .catch(err => {
        document.getElementById("subtitle").textContent = "";
        const el = document.getElementById("error");
        el.style.display = "block";
        el.textContent = `Failed to load games: ${err.message}`;
      });
  </script>
</body>
</html>
